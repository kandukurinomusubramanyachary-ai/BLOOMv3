name: Verify Bloom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/bloom-v3]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            meg-engine-v2/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pin npm for reproducible dependency resolution
        run: npm install --global npm@10.9.9

      - name: Install Bloom dependencies
        run: npm ci

      - name: Install Meg V2 dependencies
        run: npm ci --prefix meg-engine-v2 --no-audit --no-fund

      - name: Run Bloom integration tests
        run: npm test

      - name: Run Meg V2 engine tests
        run: timeout 120s npm test --prefix meg-engine-v2 -- --test-reporter=spec

      - name: Run Meg V2 deterministic benchmark
        run: npm run benchmark --prefix meg-engine-v2

      - name: Run Firestore rules tests
        run: npm run test:rules

      - name: Typecheck
        run: npm run typecheck

      - name: Check native release configuration
        run: npm run check:native-config

      - name: Expo dependency and configuration checks
        run: npx expo-doctor

      - name: Build web
        run: npm run build:web

      - name: Build production container
        run: docker build -t wholebloom:verify .

      - name: Smoke-test production container and fail-closed readiness
        shell: bash
        run: |
          docker run -d --name wholebloom-verify -p 18080:8080 \
            -e CORS_ALLOWED_ORIGINS=https://bloom-ci.invalid \
            -e BUILD_VERSION=ci \
            wholebloom:verify
          cleanup() {
            docker logs wholebloom-verify || true
            docker rm -f wholebloom-verify >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health=""
          for attempt in {1..20}; do
            if health="$(curl --fail --silent --show-error http://127.0.0.1:18080/live 2>/dev/null)"; then
              break
            fi
            sleep 1
          done

          if [ -z "$health" ]; then
            echo "Production container did not become healthy." >&2
            exit 1
          fi

          node -e '
            const health = JSON.parse(process.argv[1]);
            if (health.ok !== true || health.provider !== "meg-v2") {
              console.error("Unexpected health payload", health);
              process.exit(1);
            }
          ' "$health"

          # Public CI has no provider/Firebase credentials. Do not fake readiness.
          status="$(curl -s -o /tmp/bloom-readiness.json -w '%{http_code}' http://127.0.0.1:18080/health)"
          test "$status" = "503"
          node -e '
            const h = require("/tmp/bloom-readiness.json");
            if (h.ok !== false || h.status !== "not_ready" || h.persistence !== "sqlite") process.exit(1);
          '
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:18080/api/meg/data)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer dev-token' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18080/api/meg/chat)" = "401"
