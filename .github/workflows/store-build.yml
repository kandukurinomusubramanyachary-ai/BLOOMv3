name: Signed store builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Both production builds must finish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Require Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Configure the production EXPO_TOKEN secret and EAS signing credentials before building.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run check:native-config
      - name: Build signed Android and iOS artifacts and wait for completion
        run: eas build --platform all --profile production --non-interactive --wait --json > store-builds.json
      - name: Verify artifacts belong to this release commit
        run: node scripts/check-store-builds.cjs store-builds.json "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: store-build-evidence-${{ github.sha }}
          path: store-builds.json
          if-no-files-found: error
